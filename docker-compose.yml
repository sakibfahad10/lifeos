services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos
      POSTGRES_DB: lifeos
    ports: ["5432:5432"]
    volumes: [lifeos_pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://lifeos:lifeos@postgres:5432/lifeos
      PORT: 4000
    ports: ["4000:4000"]
    depends_on: [postgres]
volumes:
  lifeos_pgdata:
